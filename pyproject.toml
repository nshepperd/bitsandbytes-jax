[project]
name = "bitsandbytes-jax"
version = "0.2.0"
description = "bitsandbytes NF4 / 8-bit blockwise quantization for JAX, as CuTe DSL kernels, bitwise-exact vs bitsandbytes"
readme = "README.md"
authors = [
    { name = "Emily Shepperd", email = "nshepperd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # cutejax's handlers speak XLA FFI API 0.2+, which jaxlib first has in 0.8.1.
    "jax>=0.8.1",
    "numpy",
    "cutejax>=0.1.5",
    "nvidia-cutlass-dsl>=4.8.0",
]

# The CuTe DSL's cu13 runtime libraries sit behind an extra (the cu12 ones are
# an unconditional requirement of the nvidia-cutlass-dsl wheel). Pick the one
# matching the CUDA build of the installed jax: bitsandbytes-jax[cu13] for
# jax[cuda13].
[project.optional-dependencies]
cu13 = ["cutejax[cu13]"]

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bnb_jax"

[dependency-groups]
test = [
    "jax[cuda13]>=0.9.1",
    "nvidia-cutlass-dsl[cu13]>=4.8.0",
    "pytest>=7.0.0",
    "safetensors",
    # the reference implementation the tests compare against
    "bitsandbytes",
    "torch",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# cutlass ships inside the nvidia-cutlass-dsl wheel and is put on sys.path at
# runtime by a .pth file, which ty does not execute.
extra-paths = [".venv/lib/python3.11/site-packages/nvidia_cutlass_dsl/dsl_packages"]

[tool.ty.src]
# a gitignored bitsandbytes checkout lives here
exclude = ["bitsandbytes_src"]

# The CuTe DSL's traced types (tensor elements, shapes) support subscripting
# and bitwise ops at trace time without declaring them, so ty reports them
# against kernel code that is correct and GPU-tested.
[[tool.ty.overrides]]
include = ["src/bnb_jax/kernels/**"]

[tool.ty.overrides.rules]
not-subscriptable = "ignore"
unsupported-operator = "ignore"
